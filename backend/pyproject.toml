[project]
name = "syllabus-to-calendar"
version = "0.1.0"
description = "AI-powered syllabus parser and study plan generator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "icalendar>=6.0.0",
    "motor>=3.5.0",
    "httpx>=0.27.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
